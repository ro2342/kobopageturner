name: 01 - Generate signing certificate (run once)

# This workflow does NOT run on every push — only when manually triggered
# from the "Actions" tab ("Run workflow" button). One-time setup step: it
# generates a self-signed certificate, saves the private key (.pfx) back
# into the repo (used by every future build), and publishes the public key
# (.cer) as an artifact for one-time install on the phone.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cert:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $pfxPath = "uwp/KoboPageTurnerUWP/KoboPageTurnerUWP_TemporaryKey.pfx"
          $cerPath = "kobopageturner-public-cert.cer"
          $password = "KoboPageTurner2026!"

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=RodCarvalho-KoboPageTurner-SelfSigned" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Kobo Page Turner - sideload signing certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}Subject Type:End Entity")

          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          Write-Host "Certificate generated successfully."

      - name: Publish the public certificate (.cer) as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobopageturner-public-cert
          path: kobopageturner-public-cert.cer

      - name: Save the private key (.pfx) back into the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uwp/KoboPageTurnerUWP/KoboPageTurnerUWP_TemporaryKey.pfx
          git commit -m "chore: generate sideload signing certificate (automated)" || echo "nothing to commit"
          git push
