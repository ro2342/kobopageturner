name: 03 - Build Android APK

# Runs automatically on every push that touches android/, and can also be
# triggered manually from the Actions tab. Produces a debug APK ready to
# sideload (no signing/cert dance needed — Android just needs "install
# unknown apps" allowed on the phone), published to app/ so the download
# page always links the latest build.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/03-build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android/KoboPageTurner
        run: gradle assembleDebug --no-daemon

      - name: Publish the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobopageturner-apk
          path: android/KoboPageTurner/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish the APK and version.json to app/
        shell: bash
        run: |
          apk=$(find android/KoboPageTurner/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$apk" ]; then
            echo "No APK found" >&2
            exit 1
          fi
          mkdir -p app
          cp "$apk" app/kobopageturner.apk

          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/KoboPageTurner/app/build.gradle.kts)
          builtAt=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"version\":\"$version\",\"builtAt\":\"$builtAt\"}" > app/android-version.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/kobopageturner.apk app/android-version.json
          if git diff --cached --quiet -- app/kobopageturner.apk app/android-version.json; then
            echo "kobopageturner.apk and android-version.json are already up to date, nothing to commit."
          else
            git commit -m "chore: update app/kobopageturner.apk and app/android-version.json (automated)"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package app/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
